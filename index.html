<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
body{background:#10111b;color:white;font-family:Arial;padding:20px}
h1{color:#a78bfa}
.box{background:#202234;padding:20px;border-radius:16px;margin-top:20px}
textarea{width:100%;height:120px;background:#111322;color:white;padding:10px;box-sizing:border-box;border-radius:10px}
button{background:#805ad5;color:white;border:0;padding:15px;border-radius:10px;width:100%;margin-top:15px;font-size:16px}
input{margin-top:15px}
</style>
</head>
<body>
<h1>🎬 AI VIDEO STUDIO</h1>
<p>Твоя личная ИИ-видеостудия</p>
<div class="box">
<h2>✨ Видео из текста</h2>
<textarea id="prompt" placeholder="Опиши своё видео..."></textarea>
<button onclick="generate()">Создать видео</button>
<p id="result"></p>
</div>
<div class="box">
<h2>🖼️ Видео из фотографии</h2>
<input type="file" id="photo" accept="image/*">
<button onclick="showPhoto()">Загрузить фото</button>
<img id="preview" style="width:100%;margin-top:15px">
</div>
<script>
function generate(){
let p=document.getElementById('prompt').value;
document.getElementById('result').innerText=p?'Описание принято! Скоро подключим ИИ-генерацию.':'Напиши описание видео';
}
function showPhoto(){
let f=document.getElementById('photo').files[0];
if(f)document.getElementById('preview').src=URL.createObjectURL(f);
}
</script>
</body>
</html>
